name: leleq_player
description: LelegPlayer — IPTV player per iOS, Android, macOS, Fire TV, Samsung Tizen
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Video player (HLS, MPEG-TS, DASH, catchup)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # HTTP
  dio: ^5.4.3

  # Local storage
  hive_flutter: ^1.1.0

  # Settings
  shared_preferences: ^2.2.2

  # XML parsing (XMLTV EPG)
  xml: ^6.5.0

  # Image caching (loghi canali)
  cached_network_image: ^3.3.1

  # Utilities
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0

  # Icons
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
